[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.dependencies]
tuit-core = { path = "crates/tuit-core" }
tuit-maildir = { path = "crates/tuit-maildir" }
tuit-tui = { path = "crates/tuit-tui" }
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm"] }
unicode-segmentation = "1.13.3"
jiff = { version = "0.2.37", default-features = false }
rustix = { version = "1.1.5", default-features = false }
signal-hook = { version = "0.3.18", default-features = false }
