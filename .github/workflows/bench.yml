name: Speed

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # The Rust version CI uses. Bump it on purpose, not by accident.
  RUSTUP_TOOLCHAIN: "1.98.1"

jobs:
  speed:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install the pinned Rust toolchain
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal

      # GitHub runs this with bash -e -o pipefail, so if cargo bench fails
      # the step fails even though its output goes through tee. A slow
      # number never fails the step: the benchmark only reports it.
      - name: Run the speed benchmark
        run: cargo bench --locked -p tuit-mail --bench speed | tee "$RUNNER_TEMP/speed.txt"

      - name: Report the numbers in the job summary
        run: |
          {
            echo "## Speed"
            echo
            echo "These numbers come from a shared CI machine, so they are only good for spotting a large change."
            echo
            echo '```'
            cat "$RUNNER_TEMP/speed.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
