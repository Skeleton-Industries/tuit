name: Speed

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  speed:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install the pinned Rust toolchain
        # With no version named, rustup installs the one in rust-toolchain.toml.
        run: rustup toolchain install

      # No pipe here, on purpose. GitHub's default shell doesn't set pipefail,
      # so a failing cargo bench in front of a pipe would leave the step
      # green. A slow number never fails the step: the benchmark only
      # reports it.
      - name: Run the speed benchmark
        run: |
          cargo bench --locked -p tuit-mail --bench speed > "$RUNNER_TEMP/speed.txt"
          cat "$RUNNER_TEMP/speed.txt"

      - name: Report the numbers in the job summary
        run: |
          {
            echo "## Speed"
            echo
            echo "These numbers come from a shared CI machine, so they are only good for spotting a large change."
            echo
            echo '```'
            cat "$RUNNER_TEMP/speed.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
