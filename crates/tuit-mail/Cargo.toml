[package]
name = "tuit-mail"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[[bin]]
name = "tuit"
path = "src/main.rs"

[[bench]]
name = "speed"
harness = false

[dependencies]
tuit-core = { workspace = true }
tuit-maildir = { workspace = true }
tuit-tui = { workspace = true }
jiff = { workspace = true }

[dev-dependencies]
ratatui = { workspace = true }

# For tests/terminal.rs: a pseudo-terminal to run the real binary in, without `unsafe`.
[target.'cfg(unix)'.dev-dependencies]
rustix = { workspace = true, features = ["std", "pty", "termios", "event"] }
