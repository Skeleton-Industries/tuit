# Holds "no I/O in the core". Applies to this crate only. See docs/ARCHITECTURE.md.
#
# Clippy only knows what is on these lists. A path it can't find is reported as
# a warning that does not fail the build, so check the output after editing.
#
# The lists apply to this crate's tests too: no println!, dbg! or fixture files
# there. Core tests use made-up values held in the test itself.

allow-print-in-tests = true
allow-dbg-in-tests = true

disallowed-types = [
    { path = "std::fs::File", reason = "the core does no file access" },
    { path = "std::fs::OpenOptions", reason = "the core does no file access" },
    { path = "std::net::TcpStream", reason = "the core does no network access" },
    { path = "std::net::TcpListener", reason = "the core does no network access" },
    { path = "std::net::UdpSocket", reason = "the core does no network access" },
    { path = "std::process::Command", reason = "the core does not run programs" },
]

disallowed-methods = [
    { path = "std::fs::read", reason = "the core does no file access" },
    { path = "std::fs::read_to_string", reason = "the core does no file access" },
    { path = "std::fs::write", reason = "the core does no file access" },
    { path = "std::fs::read_dir", reason = "the core does no file access" },
    { path = "std::fs::remove_file", reason = "the core does no file access" },
    { path = "std::env::var", reason = "the core does not read the environment" },
]
